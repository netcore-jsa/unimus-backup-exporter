name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gated at error severity for now (shellcheck is preinstalled on the
      # runner). Tighten to `warning`/`style` after the quoting/printf cleanup.
      - run: shellcheck --severity=error unimus-backup-exporter.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Black-box e2e (mock server + expected trees)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Bash unit tests
        run: bats tests/unit/bash/
