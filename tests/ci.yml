# CI workflow TEMPLATE for the test suite.
#
# This file lives under tests/ so all testing code stays in one place. GitHub
# only runs workflows from .github/workflows/, so activate it with:
#
#     mkdir -p .github/workflows && cp tests/ci.yml .github/workflows/ci.yml
#
# (Keep it as a copy, not a symlink -- GitHub Actions does not follow symlinks.)

name: tests

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck unimus-backup-exporter.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Black-box e2e (mock server + expected trees)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Bash unit tests
        run: bats tests/unit/bash/
